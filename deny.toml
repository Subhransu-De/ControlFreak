[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
# cargo-deny 0.22 checks only workspace crates for unmaintained advisories by default. Keep
# transitive dependencies covered.
unmaintained = "all"
ignore = [
    # chrono is unmaintained, not vulnerable. rmcp, the MCP SDK, requires it in every release up
    # to 3.11.0, and ControlFreak does not use it directly. Remove once rmcp drops it.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained transitive dependency of rmcp with no replacement yet" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    { crate = "borrow-or-share", allow = ["MIT-0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
