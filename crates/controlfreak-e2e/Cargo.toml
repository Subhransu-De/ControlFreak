[package]
name = "controlfreak-e2e"
description = "Live end-to-end suites for the ControlFreak server on a disposable Windows desktop (never shipped)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "controlfreak-e2e"
path = "src/main.rs"

[dependencies]
base64.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
jsonschema = { version = "0.63.1", default-features = false }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
