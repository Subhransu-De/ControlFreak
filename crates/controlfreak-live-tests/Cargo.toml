[package]
name = "controlfreak-live-tests"
description = "Disposable fixture window and live end-to-end tests for the ControlFreak server (never shipped)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Test support only. `cargo build -p controlfreak-server -p controlfreak-installer --release`, the
# installer packaging and `cargo xtask` never build or package this crate.
[[bin]]
name = "controlfreak-fixture"
path = "src/fixture.rs"

[target.'cfg(windows)'.dependencies]
# Same crate and version as controlfreak-platform; only Win32 windowing is needed here.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
base64.workspace = true
png.workspace = true
serde_json.workspace = true

[lints]
workspace = true
