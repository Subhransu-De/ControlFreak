version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
      time: "09:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "09:15"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-actions)"
