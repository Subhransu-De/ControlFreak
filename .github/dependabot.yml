version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * *"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "15 9 * * *"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-actions)"
