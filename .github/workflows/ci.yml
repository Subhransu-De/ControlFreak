name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting, Clippy, and docs
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check documentation
        run: |
          $env:RUSTDOCFLAGS = "-D warnings"
          cargo doc --workspace --no-deps --locked

  tests:
    name: Tests
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run tests
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          mkdir -p test-results
          cargo test --workspace --locked 2>&1 | tee test-results/cargo-test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-tests
          path: test-results
          if-no-files-found: ignore
          retention-days: 90

  live-desktop:
    name: Live desktop tests
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The hosted runner is a disposable interactive desktop. The suites inject real input there
      # and refuse to run anywhere else without this variable.
      - name: Run the live e2e suites
        env:
          CONTROLFREAK_LIVE_DESKTOP: "1"
        run: cargo xtask e2e --strict --out test-results/e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-live-desktop
          path: test-results
          if-no-files-found: ignore
          retention-days: 90

  windows-build:
    name: Release build
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build optimized server and installer helper
        run: cargo build -p controlfreak-server -p controlfreak-installer --release --locked

      - name: Install pinned portable compiler
        run: cargo xtask compiler --output "$env:RUNNER_TEMP/inno"

      - name: Build Windows installer and portable package
        run: cargo xtask package --compiler "$env:RUNNER_TEMP/inno/compiler/ISCC.exe" --output "$env:RUNNER_TEMP/installer-package" --test-setup

      # The same check as a release: the package must report this commit, clean.
      - name: Verify portable executable and package checksums
        run: cargo xtask verify --package "$env:RUNNER_TEMP/installer-package" --output "$env:RUNNER_TEMP/portable test 日本語" --expect-revision (git rev-parse HEAD)

      - name: Verify installation lifecycle with synthetic client profiles
        run: cargo xtask test-installer --package "$env:RUNNER_TEMP/installer-package" --output "$env:RUNNER_TEMP/installer-test"

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          command: check advisories bans licenses sources

  workflow-policy:
    name: GitHub Actions policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # install-action does not ship actionlint, so download the pinned
      # release binary and check it against its published SHA-256.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Validate workflows
        run: '"${RUNNER_TEMP}/actionlint"'

  hawk:
    name: Hawk unsafe-code audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
          rustup target add x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-xwin
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-xwin@0.23.0
          fallback: none

      - name: Install Hawk
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/astral-sh/hawk/releases/download/0.1.12/cargo-hawk-installer.sh \
            --output /tmp/cargo-hawk-installer.sh
          echo "583c610c6f5433543b8bc6901cb2d5300b3f6f2f0d34a868bd3d189158f2857a  /tmp/cargo-hawk-installer.sh" \
            | sha256sum --check
          sh /tmp/cargo-hawk-installer.sh

      - name: Run Hawk against the Windows target
        shell: bash
        run: |
          target=x86_64-pc-windows-msvc
          eval "$(cargo xwin env --quiet --target "$target" --manifest-path Cargo.toml)"
          cargo hawk check \
            --manifest-path Cargo.toml \
            --target "$target" \
            -D warnings
