name: Auto-assign pull requests

# pull_request_target runs with a write token in the context of the base
# branch. It is safe here only because the job never checks out or runs code
# from the pull request. Do not add a checkout step to this workflow.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assign-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assign repository owner
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: gh pr edit "$PR_URL" --add-assignee "$REPOSITORY_OWNER"
