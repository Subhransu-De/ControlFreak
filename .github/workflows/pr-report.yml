name: PR test report

on:
  workflow_run:
    workflows: [CI]
    types: [requested, completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: pr-report-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  report:
    name: Post test report
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Render and post the report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.action }}
        run: >-
          cargo run -p controlfreak-e2e --locked --
          pr-report --repo "$REPO" --run-id "$RUN_ID" --head-sha "$HEAD_SHA"
          --event "$EVENT" --work-dir "$RUNNER_TEMP/pr-report"
