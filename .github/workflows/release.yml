name: Release
# Prepare a release from main with Run workflow. Leave the version empty for
# the next patch version, or the release of a prerelease. The prepare job moves
# the Unreleased entries of CHANGELOG.md into a dated section, bumps the
# version and opens a "chore: release vX.Y.Z" pull request from the
# release/vX.Y.Z branch. The workflow never pushes to main.
# Merge that pull request, then push the vX.Y.Z tag on the merged commit. The
# tag builds, tests and verifies the package, and the publish job waits for
# approval on the release environment. Approve it to publish the GitHub
# release; reject it to stop with nothing published.
# Run it on an existing vX.Y.Z tag to retry publication. A dry run only builds
# and verifies, on any branch.
run-name: >-
  ${{ inputs.dry_run && 'Dry run' || (github.ref_type == 'tag' && 'Release') || 'Prepare release' }}
  ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || 'next version' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version such as 0.3.0 or 0.3.0-rc.1. Leave empty for the next patch version."
        required: false
        type: string
      dry_run:
        description: "Dry run: build and verify only, on any branch. No pull request is opened and nothing is tagged or published."
        type: boolean
        default: false
  push:
    tags:
      - "v*"

# Publication runs one at a time. Preparing a release and dry runs do not wait
# for a publication that is waiting for approval.
concurrency:
  group: ${{ github.ref_type == 'tag' && !inputs.dry_run && 'release-publication' || format('release-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Run workflow on main. Opens the release pull request instead of pushing to
  # main, so the release commit reaches main through a reviewed, CI-checked pull
  # request like every other change.
  prepare:
    name: Open release pull request
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref_type == 'branch' }}
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      # Pushes the release/vX.Y.Z branch. The workflow never pushes to main.
      contents: write
      # Opens the release pull request.
      pull-requests: write
      # Reads the CI runs of this commit.
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: throw 'Start a new release from main, select an existing tag to retry publication, or tick the dry run box to test another branch.'

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require passing CI on this commit
        run: |
          $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --commit $env:GITHUB_SHA --event push --status success --json headSha --limit 20
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the CI runs of this commit.' }
          if (@($runs | ConvertFrom-Json).Count -eq 0) { throw "CI has not passed on $env:GITHUB_SHA. Wait for it to pass on main, then run the release again." }

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false

      - name: Prepare release version and changelog
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $requested = "$env:REQUESTED_VERSION".Trim()
          $prepare = @('xtask', 'prepare-release', '--date', (Get-Date -AsUTC -Format 'yyyy-MM-dd'))
          if ($requested) { $prepare += @('--version', $requested) }
          cargo @prepare
          if ($LASTEXITCODE -ne 0) { throw 'Release preparation failed.' }
          $prepared = cargo xtask version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot determine release version.' }
          git show-ref --verify --quiet "refs/tags/v$prepared"
          if ($LASTEXITCODE -eq 0) { throw "Tag v$prepared already exists. Choose a higher version, or run the workflow on that tag to retry it." }
          if ($LASTEXITCODE -ne 1) { throw 'Could not check existing tags.' }
          cargo xtask release-notes --output "$env:RUNNER_TEMP/release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release changelog is missing or empty.' }
          "tag=v$prepared" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Push release branch and open pull request
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $branch = "release/$env:RELEASE_TAG"
          $title = "chore: release $env:RELEASE_TAG"
          git add -- Cargo.toml Cargo.lock CHANGELOG.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Release diff validation failed.' }
          git diff --cached
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the release diff.' }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m $title
          if ($LASTEXITCODE -ne 0) { throw 'Release commit failed.' }
          gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure release authentication.' }
          git ls-remote --exit-code --heads origin "refs/heads/$branch" > $null
          if ($LASTEXITCODE -eq 0) { throw "Branch $branch already exists. Close its pull request and delete the branch, then run the release again." }
          if ($LASTEXITCODE -ne 2) { throw 'Could not check existing branches.' }
          git push origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { throw "Could not push $branch." }
          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = Join-Path $env:RUNNER_TEMP 'release-pr.md'
          @(
            "Prepared by [Release run $env:GITHUB_RUN_ID]($run) from $env:GITHUB_SHA."
            ''
            "To release ${env:RELEASE_TAG}:"
            ''
            '1. Close and reopen this pull request to start CI. Pull requests opened by the workflow token do not start workflows.'
            "2. When CI passes, squash merge it and keep the title ``$title``."
            "3. When CI passes on ``main``, tag the merged commit: ``git fetch origin``, ``git tag $env:RELEASE_TAG <merged commit>``, ``git push origin $env:RELEASE_TAG``."
            '4. The tag starts the Release workflow. Read its summary, then approve the `release` environment to publish.'
            ''
            'To stop the release, close this pull request and delete its branch.'
            ''
            '## Release notes'
            ''
            (Get-Content -Raw "$env:RUNNER_TEMP/release-notes.md")
          ) | Out-File -FilePath $body -Encoding utf8
          $url = gh pr create --repo $env:GITHUB_REPOSITORY --base main --head $branch --title $title --body-file $body
          if ($LASTEXITCODE -ne 0) { throw "Pushed $branch, but could not open its pull request. Open it by hand, or delete the branch and run the release again." }
          "::notice::Opened $url"
          @(
            "## Release pull request for $env:RELEASE_TAG"
            ''
            "$url. Close and reopen it to start CI, merge it, then push the $env:RELEASE_TAG tag on the merged commit."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  # A pushed vX.Y.Z tag, a retry on an existing tag, or a dry run.
  build:
    name: Build and verify Windows release
    if: ${{ github.ref_type == 'tag' || inputs.dry_run }}
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: read
      # Reads the CI runs of this commit.
      actions: read
      # Build provenance attestations for the published files.
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # CI runs on pushes to main only, so a passing push run also shows that
      # the tagged commit is on main.
      - name: Require passing CI on the tagged commit
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the tagged commit.' }
          $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --commit $commit --event push --status success --json headSha --limit 20
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the CI runs of this commit.' }
          if (@($runs | ConvertFrom-Json).Count -eq 0) { throw "CI has not passed on main for $commit. Tag the merged release commit, wait for CI to pass on it, then re-run this workflow." }

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false

      - name: Prepare and validate release version and changelog
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $requested = "$env:REQUESTED_VERSION".Trim()
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            if ($requested -and "v$($requested.TrimStart('v'))" -ne $env:GITHUB_REF_NAME) {
              throw "Leave the version empty, or enter the version of $env:GITHUB_REF_NAME, to retry that tag."
            }
            cargo xtask version --tag $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { throw 'Release tag does not match the workspace.' }
            "::notice::Releasing $env:GITHUB_REF_NAME"
          } else {
            # A dry run on a branch. The build job runs only for tags and dry runs.
            $prepare = @('xtask', 'prepare-release', '--date', (Get-Date -AsUTC -Format 'yyyy-MM-dd'))
            if ($requested) { $prepare += @('--version', $requested) }
            cargo @prepare
            if ($LASTEXITCODE -ne 0) { throw 'Release preparation failed.' }
            $prepared = cargo xtask version
            if ($LASTEXITCODE -ne 0) { throw 'Cannot determine release version.' }
            git show-ref --verify --quiet "refs/tags/v$prepared"
            if ($LASTEXITCODE -eq 0) { throw "Tag v$prepared already exists. Choose a higher version, or run the workflow on that tag to retry it." }
            if ($LASTEXITCODE -ne 1) { throw 'Could not check existing tags.' }
            "::notice::Dry run of release v$prepared"
          }
          $releaseVersion = cargo xtask version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot determine release version.' }
          "RELEASE_TAG=v$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "tag=v$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          cargo xtask release-notes --output "$env:RUNNER_TEMP/release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release changelog is missing or empty.' }

      - name: Install cargo-auditable and cargo-cyclonedx
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-auditable@0.7.5,cargo-cyclonedx@0.5.9
          fallback: none

      - name: Test release configuration
        run: cargo test --workspace --release --locked

      - name: Build auditable server and setup helper
        env:
          # Used only when the checkout has no Git metadata.
          CONTROLFREAK_BUILD_REVISION: ${{ github.sha }}
        run: cargo auditable build -p controlfreak-server -p controlfreak-installer --release --locked

      - name: Generate CycloneDX SBOMs
        run: cargo cyclonedx --format json --target x86_64-pc-windows-msvc --override-filename controlfreak.cdx

      - name: Install pinned portable compiler
        run: cargo xtask compiler --output "$env:RUNNER_TEMP/inno"

      - name: Build installer and portable archive
        run: cargo xtask package --compiler "$env:RUNNER_TEMP/inno/compiler/ISCC.exe" --output dist --tag $env:RELEASE_TAG --require-sbom

      - name: Verify packaged executable and checksums
        run: |
          $verify = @('xtask', 'verify', '--package', 'dist', '--output', "$env:RUNNER_TEMP/portable test 日本語")
          # A tag build must report the tagged commit with a clean tree. A dry run on a branch
          # bumps the version first, so it is honestly dirty and is not held to this.
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            $commit = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the tagged commit.' }
            $verify += @('--expect-revision', $commit)
          }
          cargo @verify
          if ($LASTEXITCODE -ne 0) { throw 'Packaged executable verification failed.' }

      - name: Verify the production installer in a synthetic profile
        run: cargo xtask test-installer --package dist --output "$env:RUNNER_TEMP/installer-test" --production-installer

      # The installer, the ZIP and the executables inside it, so an extracted
      # controlfreak.exe can be verified on its own. The source is the tagged
      # release commit on main.
      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
            dist/payload/*.exe

      # The approver reads this summary on the run page before approving.
      - name: Summarize the release for approval
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $heading = if ($env:DRY_RUN -eq 'true') { "Dry run of $env:RELEASE_TAG" } else { "Release $env:RELEASE_TAG" }
          $commit = git rev-parse HEAD
          $source = if ($env:DRY_RUN -eq 'true') {
            "Built from $env:GITHUB_REF_NAME at $commit. Nothing is tagged or published."
          } else {
            "Built from the tag $env:GITHUB_REF_NAME at $commit. Approving the release environment publishes the GitHub release for this tag."
          }
          @(
            "## $heading"
            ''
            $source
            ''
            '### Release notes'
            ''
            (Get-Content -Raw "$env:RUNNER_TEMP/release-notes.md")
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-package
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  # The required reviewer on the release environment approves each release.
  # Nothing is published before approval. The workflow never pushes a branch
  # or tag here: the maintainer pushed the tag on the merged release commit.
  publish:
    name: Publish GitHub release
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: windows-2025
    timeout-minutes: 20
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.build.outputs.tag }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      # The tagged commit the package was built from. cargo xtask publish
      # refuses unless the remote tag still points to it.
      - name: Check out the built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false

      - name: Download release package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-package
          path: dist

      - name: Publish GitHub release
        run: cargo xtask publish --package dist --tag $env:RELEASE_TAG

  # A separate job keeps the winget token out of the job that holds write
  # access to this repository. Prereleases are not submitted.
  winget:
    name: Submit stable release to winget
    needs: [build, publish]
    if: ${{ !contains(needs.build.outputs.tag, '-') }}
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
      KOMAC_VERSION: 2.17.1
      KOMAC_SHA256: A97C002C5FFA15F232AF117EFAC6774E755D27ACC47EBA00F1661033267D7438

    steps:
      - name: Skip without a winget token
        if: env.HAS_WINGET_TOKEN != 'true'
        run: echo "::notice::WINGET_TOKEN is not set, so $env:RELEASE_TAG was not submitted to winget."

      # `komac update` can only add a version to a package that winget-pkgs
      # already lists. Until the first submission is merged there, skip with a
      # notice instead of failing every release; submission starts by itself
      # once the package is listed. Any answer other than 200 or 404 fails.
      - name: Check that winget lists the package
        id: catalog
        if: env.HAS_WINGET_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $uri = 'https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/s/SubhransuDe/ControlFreak'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          switch ($response.StatusCode) {
            200 { "listed=true" >> $env:GITHUB_OUTPUT }
            404 {
              "listed=false" >> $env:GITHUB_OUTPUT
              "::notice::SubhransuDe.ControlFreak is not in microsoft/winget-pkgs yet, so $env:RELEASE_TAG was not submitted. Re-run this job once the first submission is merged."
            }
            default { throw "Could not check the winget catalog: HTTP $($response.StatusCode)." }
          }

      - name: Install pinned Komac
        if: env.HAS_WINGET_TOKEN == 'true' && steps.catalog.outputs.listed == 'true'
        run: |
          $komac = Join-Path $env:RUNNER_TEMP 'komac.exe'
          Invoke-WebRequest "https://github.com/russellbanks/Komac/releases/download/v$env:KOMAC_VERSION/komac-$env:KOMAC_VERSION-x86_64-pc-windows-msvc.exe" -OutFile $komac
          if ((Get-FileHash $komac -Algorithm SHA256).Hash -ne $env:KOMAC_SHA256) { throw 'Komac checksum mismatch.' }

      - name: Open winget-pkgs pull request
        if: env.HAS_WINGET_TOKEN == 'true' && steps.catalog.outputs.listed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $release = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases"
          & (Join-Path $env:RUNNER_TEMP 'komac.exe') update SubhransuDe.ControlFreak `
            --version $version `
            --urls "$release/download/$env:RELEASE_TAG/ControlFreak-$version.exe" `
            --release-notes-url "$release/tag/$env:RELEASE_TAG" `
            --submit
          if ($LASTEXITCODE -ne 0) { throw 'Komac could not submit the winget update.' }
