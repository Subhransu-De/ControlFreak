[workspace]
members = [
    "crates/controlfreak-core",
    "crates/controlfreak-mcp",
    "crates/controlfreak-platform",
    "crates/controlfreak-server",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.97"
version = "0.1.0-alpha"

[workspace.dependencies]
controlfreak-core = { version = "=0.1.0-alpha", path = "crates/controlfreak-core" }
controlfreak-mcp = { version = "=0.1.0-alpha", path = "crates/controlfreak-mcp" }
controlfreak-platform = { version = "=0.1.0-alpha", path = "crates/controlfreak-platform" }
rmcp = { version = "=3.1.2", default-features = false, features = ["server", "transport-io"] }
base64 = "0.23"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["io-std", "macros", "rt-multi-thread"] }
windows = "0.62"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
undocumented_unsafe_blocks = "warn"
